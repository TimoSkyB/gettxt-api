[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gettxt-api"
version = "0.1.0"
description = "Dependency-free Python client for the gettxt document-to-text API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gettxt", email = "support@gettxt.ai" }]
keywords = ["ocr", "pdf", "document-ai", "text-extraction", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://gettxt.ai/"
Documentation = "https://gettxt.ai/api-documentation"
Repository = "https://github.com/TimoSkyB/gettxt-api"

[tool.setuptools.packages.find]
where = ["src"]

